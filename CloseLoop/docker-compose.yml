# CloseLoop — full stack (Postgres + FastAPI backend + React/Nginx frontend + Adminer)
#
# Usage:
#   docker compose up --build               # first time: builds images + seeds demo data
#   docker compose up -d                    # subsequent runs
#   docker compose down                     # stop containers (keep DB volume)
#   docker compose down -v                  # stop AND wipe the DB volume
#
# Open: http://localhost:8080 (frontend)
# Adminer (DB UI): http://localhost:8081 (user: postgres, password: postgres, db: closeloop)
# Demo accounts printed in backend logs (or see README.md)

services:
  db:
    image: postgres:16-alpine
    container_name: closeloop-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: closeloop
    ports:
      - "5433:5432" # host:container — 5433 so it doesn't clash with a local Postgres
    volumes:
      - closeloop_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d closeloop"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
    container_name: closeloop-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # ENV=development here because this compose file serves the app over
      # plain HTTP on localhost. Deploying behind HTTPS? Set ENV=production,
      # COOKIE_SECURE=true, and a real (non-placeholder) JWT_SECRET — the
      # app refuses to start in production mode without them.
      ENV: development
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/closeloop
      JWT_SECRET: dev-secret-change-me-in-production
      JWT_ALGORITHM: HS256
      JWT_EXPIRES_MINUTES: "30"
      JWT_REFRESH_EXPIRES_DAYS: "7"
      COOKIE_SECURE: "false"
      LOGIN_MAX_ATTEMPTS: "5"
      LOGIN_LOCKOUT_MINUTES: "15"
      CORS_ORIGINS: "http://localhost:8080,http://localhost:5173"
      SEED_ON_BOOT: "1" # set to 0 after first boot to preserve data
      UPLOAD_DIR: "/app/uploads"
      # HRMS integration — values come from ./.env (git-ignored); blank
      # disables it. Never put the secret in this file.
      HRMS_BASE_URL: ${HRMS_BASE_URL:-https://api-hrms.innovationnxt.com/backend}
      HRMS_TENANT_ID: ${HRMS_TENANT_ID:-}
      HRMS_SECRET: ${HRMS_SECRET:-}
      # Automated timesheet. Both stay off until the HRMS timesheet API is wired
      # into backend/app/services/hrms_timesheet_gateway.py (see backend/TIMESHEET.md).
      HRMS_TIMESHEET_POST_PATH: ${HRMS_TIMESHEET_POST_PATH:-/v1/external/timesheets}
      HRMS_TIMESHEET_LIST_PATH: ${HRMS_TIMESHEET_LIST_PATH:-}
      TIMESHEET_SUBMIT_ENABLED: ${TIMESHEET_SUBMIT_ENABLED:-false}
      TIMESHEET_REMINDERS_ENABLED: ${TIMESHEET_REMINDERS_ENABLED:-false}
    ports:
      - "8002:8000"
    volumes:
      - closeloop_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
    container_name: closeloop-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5178:80"

  adminer:
    image: adminer:latest
    container_name: closeloop-adminer
    restart: unless-stopped 
    depends_on:
      - db
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    command: php -S 0.0.0.0:8080

volumes:
  closeloop_pgdata:
  closeloop_uploads:
