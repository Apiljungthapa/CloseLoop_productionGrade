server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Attachment uploads — backend allows 20 MB per file
    # (attachment_storage.MAX_ATTACHMENT_SIZE); give headroom for the
    # multipart envelope. Default nginx cap is 1 MB, which silently 413s
    # any real attachment.
    client_max_body_size 25m;

    # Chatbot answers stream as Server-Sent Events: never buffer or cache them, and tell the
    # edge nginx in front of this container not to either (X-Accel-Buffering is consumed by this
    # nginx and not forwarded, so it is re-added explicitly for the next hop).
    location /api/chat/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300;
        add_header X-Accel-Buffering no always;
        add_header Cache-Control "no-cache, no-transform" always;
    }

    # API proxy
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
        proxy_request_buffering off;
    }

    # WebSocket proxy
    location /ws {
        proxy_pass http://backend:8000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # Hashed build assets are safe to cache forever; index.html is not — it's
    # the file that points at the current asset hashes, so a stale cached
    # copy keeps serving an old JS/CSS bundle after every deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
